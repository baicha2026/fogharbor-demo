[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "build_resume.py",
    "inspect_resume.py",
    "verify_resume.py",
    "career/build_resume.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
